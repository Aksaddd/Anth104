<style>
/* Layout: header → the original document → what's coming up → at a glance → grading → key dates → schedule by week → notes. */
.sy-card{background:var(--paper);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
.sy-card h2{margin:0 0 12px;font:700 20px/1.2 var(--display,var(--body));letter-spacing:-.02em}
.sy-empty{color:var(--muted);text-align:center;padding:34px 22px;line-height:1.5}.sy-empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.sy-pdf{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;text-decoration:none;color:inherit}
.sy-pdf .ic{width:44px;height:52px;border-radius:9px;background:#ff375f;color:#fff;display:grid;place-items:center;font:700 11px var(--body)}
.sy-pdf b{display:block;font-size:17px}.sy-pdf small{display:block;color:var(--muted);font-size:13.5px;line-height:1.4;margin-top:2px}
.sy-pdf .go{font:600 14px var(--body);color:var(--accent-ink,#fff);background:var(--accent);border-radius:980px;padding:8px 16px}
.sy-next{display:flex;flex-direction:column;gap:3px;background:var(--accent-soft)}
.sy-next .k{font:600 12px var(--body);color:var(--accent);text-transform:uppercase;letter-spacing:.04em}.sy-next b{font-size:19px;letter-spacing:-.015em}.sy-next span:last-child{color:var(--muted);font-size:14.5px}
.sy-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 20px;margin:0}
.sy-facts dt{font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.sy-facts dd{margin:3px 0 0;font-size:15.5px;line-height:1.4}
.sy-grade{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.sy-grade:first-of-type{border-top:0;padding-top:0}
.sy-grade b{font-weight:600;font-size:15.5px}.sy-grade small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.sy-grade>span{font:700 17px var(--body);font-variant-numeric:tabular-nums}
.sy-grade i{grid-column:1/-1;height:6px;border-radius:980px;background:var(--fill,#e8e8ed);overflow:hidden}.sy-grade u{display:block;height:100%;background:var(--accent);border-radius:inherit}
.sy-dates,.sy-notes{list-style:none;margin:0;padding:0}
.sy-dates li{display:grid;grid-template-columns:104px 1fr auto;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-size:15px}
.sy-dates li:first-child{border-top:0}.sy-dates time{color:var(--muted);font-variant-numeric:tabular-nums}
.sy-dates em{font:600 10.5px var(--body);font-style:normal;text-transform:uppercase;letter-spacing:.04em;border-radius:5px;padding:2px 6px;margin-left:8px;background:var(--fill,#e8e8ed);color:var(--muted)}
.sy-dates em.t-exam{background:#ffe5e8;color:#c4153f}.sy-dates em.t-due{background:#fff4e5;color:#b25000}
[data-theme="dark"] .sy-dates em.t-exam{background:#4a1722;color:#ff8fa3}[data-theme="dark"] .sy-dates em.t-due{background:#42300f;color:#ffb340}
.sy-dates li.past{opacity:.45}.sy-dates li.next{font-weight:600}.sy-dates li b{font:700 11px var(--body);color:#fff;background:var(--accent);border-radius:980px;padding:3px 9px}
.sy-note{margin:-6px 0 10px;color:var(--muted);font-size:13.5px}
.sy-week{padding:12px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}.sy-week.past{opacity:.5}
.sy-week h3{margin:0 0 6px;font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sy-row{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:4px 0;font-size:15px;line-height:1.4}
.sy-row time{color:var(--muted);font-variant-numeric:tabular-nums}.sy-row small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.sy-row.off span{color:var(--muted);font-style:italic}
.sy-notes li{padding:8px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);font-size:15px;line-height:1.45}.sy-notes li:first-child{border-top:0}
@media (max-width:520px){.sy-dates li{grid-template-columns:86px 1fr}.sy-dates li b{grid-column:2;justify-self:start}.sy-pdf{grid-template-columns:40px 1fr}.sy-pdf .go{grid-column:2;justify-self:start}}
</style>
