<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eureka · From a pile of class files to questions you can practice</title>
<meta name="description" content="Eureka turns a class's scattered slides, readings and worksheets into one calm place to study, practice and review. See how it works for students and for professors.">
<meta name="theme-color" content="#05070d">
<link rel="preload" as="image" href="../assets/hero/eureka-poster.jpg" media="(min-width:700px)">
<script src="../shared/platform.js"></script>
<script>window.COURSE = { id: "hub", prefix: "a104-", name: "Eureka", base: "../" };</script>
<script src="../shared/settings.js"></script>
<style>
/* The stand-alone "What is Eureka?" page: the night sky, a slim bar, and the shared explanation (shared/about.js). */
:root{--body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;--display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:#05070d;color:#f5f5f7;font:400 17px/1.47 var(--body);letter-spacing:-.022em;-webkit-font-smoothing:antialiased}
.sky{position:fixed;inset:0;z-index:-1;background:#05070d url(../assets/hero/eureka-poster-sm.jpg) center/cover no-repeat}
@media (min-width:700px){.sky{background-image:url(../assets/hero/eureka-poster.jpg)}}
.sky video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.5s ease-in-out}.sky video.on{opacity:1}
.sky::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(3,5,10,.42),rgba(3,5,10,.62) 40%,rgba(3,5,10,.82))}
.gnav{position:sticky;top:0;z-index:40;background:rgba(5,7,13,.6);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid rgba(255,255,255,.12)}
.gnav .inner{max-width:1040px;margin:0 auto;padding:0 22px;display:flex;align-items:center;gap:26px;height:48px}
.gnav .brand{font:600 19px/1 var(--display);letter-spacing:-.02em;color:#f5f5f7;text-decoration:none;margin-right:auto}
.pill{display:inline-block;font:400 12.5px/1 var(--body);color:#fff;background:#2997ff;border-radius:980px;padding:7px 13px;text-decoration:none}
footer{border-top:1px solid rgba(255,255,255,.16);padding:22px;color:rgba(235,238,245,.5);font-size:12px;text-align:center}
body.demo-only .gnav,body.demo-only footer,body.demo-only .sky{display:none}body.demo-only{background:#f5f5f7;overflow:hidden}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head><body>
<div class="sky" aria-hidden="true"><video id="sky" muted loop playsinline preload="none" tabindex="-1" disablepictureinpicture disableremoteplayback></video></div>
<header class="gnav"><div class="inner">
  <a class="brand" href="../index.html">Eureka</a>
  <a class="pill" href="../index.html#classes">Open your library</a>
  <button type="button" id="settingsBtn" hidden></button>
</div></header>
<div id="aboutHost"></div>
<footer>Eureka · Study guides, practice and exams for your classes.</footer>
<script src="../shared/about.js"></script>
<script>
(() => {
  const only = new URLSearchParams(location.search).has("demo"); if (only) document.body.classList.add("demo-only");
  window.EurekaDemo = window.EurekaAbout.mount(document.getElementById("aboutHost"), { base: "../", library: "../index.html#classes", only });
  // the sky behind the page: the still paints first, the video joins once the page has loaded
  const sky = document.getElementById("sky"), conn = navigator.connection || {}, slow = conn.saveData || /(^|-)2g|3g/.test(conn.effectiveType || ""), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function startSky() {
    if (only || reduce || slow || sky.src) return;
    sky.src = innerWidth * (devicePixelRatio || 1) > 1400 ? "../assets/hero/eureka-1080.mp4" : "../assets/hero/eureka-720.mp4";
    sky.addEventListener("canplay", () => sky.classList.add("on"), { once: true }); sky.addEventListener("error", () => sky.remove(), { once: true });
    const p = sky.play(); if (p && p.catch) p.catch(() => { });
  }
  const idle = window.requestIdleCallback || (f => setTimeout(f, 300));
  if (document.readyState === "complete") idle(startSky); else addEventListener("load", () => idle(startSky), { once: true });
  document.addEventListener("visibilitychange", () => { if (!sky.src || !sky.isConnected) return; if (document.hidden) sky.pause(); else { const p = sky.play(); if (p && p.catch) p.catch(() => { }) } });
})();
</script>
</body></html>
